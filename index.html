<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Grok AI</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#0a0a0a;
            color:white;
            font-family:-apple-system, BlinkMacSystemFont, sans-serif;
            height:100vh;
            display:flex;
            flex-direction:column;
            overflow:hidden;
        }
        .header {
            background:#111;
            padding:12px 16px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            border-bottom:1px solid #1f1f1f;
        }
        .header-left { display:flex; align-items:center; gap:10px; }
        .avatar {
            width:38px; height:38px;
            background:linear-gradient(135deg,#00b4d8,#0077b6);
            border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-size:18px;
        }
        .header-info h1 { font-size:16px; font-weight:700; }
        .header-info p { font-size:12px; color:#4caf50; }
        .settings-btn { background:none; border:none; color:#555; font-size:22px; cursor:pointer; }
        .mode-bar {
            background:#0f0f0f;
            padding:8px 12px;
            display:flex;
            gap:8px;
            overflow-x:auto;
            border-bottom:1px solid #1a1a1a;
        }
        .mode-bar::-webkit-scrollbar { display:none; }
        .mode-btn {
            background:#1a1a1a;
            border:1px solid #2a2a2a;
            border-radius:20px;
            padding:7px 14px;
            color:#888;
            cursor:pointer;
            font-size:13px;
            white-space:nowrap;
            flex-shrink:0;
        }
        .mode-btn.active { background:#00b4d8; border-color:#00b4d8; color:white; }
        .mode-btn.red.active { background:#ff4444; border-color:#ff4444; color:white; }
        .chat {
            flex:1;
            overflow-y:auto;
            padding:16px;
            display:flex;
            flex-direction:column;
            gap:12px;
        }
        .msg-wrap { display:flex; flex-direction:column; animation:fadeUp 0.3s ease; }
        .msg-wrap.user { align-items:flex-end; }
        .msg-wrap.bot { align-items:flex-start; }
        .msg-wrap.system { align-items:center; }
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(8px); }
            to { opacity:1; transform:translateY(0); }
        }
        .msg {
            max-width:82%;
            padding:11px 15px;
            border-radius:18px;
            font-size:15px;
            line-height:1.55;
            word-wrap:break-word;
        }
        .msg.user { background:linear-gradient(135deg,#0077b6,#00b4d8); border-bottom-right-radius:4px; }
        .msg.bot { background:#1e1e1e; border-bottom-left-radius:4px; color:#e8e8e8; }
        .msg.system { background:transparent; color:#555; font-size:12px; font-style:italic; text-align:center; }
        .msg.typing { background:#1e1e1e; border-bottom-left-radius:4px; color:#666; font-style:italic; }
        .bot-name { font-size:11px; color:#555; margin-bottom:4px; margin-left:4px; }
        .user-name { font-size:11px; color:#555; margin-bottom:4px; margin-right:4px; }
        .msg-img { max-width:260px; border-radius:15px; overflow:hidden; border:1px solid #2a2a2a; align-self:flex-start; }
        .msg-img img { width:100%; display:block; }
        .img-loading {
            width:260px; height:200px;
            background:#1a1a1a;
            display:flex;
            align-items:center;
            justify-content:center;
            border-radius:15px;
            color:#555;
            flex-direction:column;
            gap:10px;
        }
        .spinner {
            width:30px; height:30px;
            border:3px solid #333;
            border-top-color:#00b4d8;
            border-radius:50%;
            animation:spin 1s linear infinite;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
        .input-area {
            background:#111;
            padding:10px 12px;
            display:flex;
            gap:8px;
            align-items:flex-end;
            border-top:1px solid #1f1f1f;
        }
        .input-field {
            flex:1;
            background:#1a1a1a;
            border:1px solid #2a2a2a;
            border-radius:22px;
            padding:11px 16px;
            color:white;
            font-size:15px;
            outline:none;
            resize:none;
            max-height:120px;
            line-height:1.4;
            font-family:inherit;
        }
        .input-field:focus { border-color:#00b4d8; }
        .input-field::placeholder { color:#444; }
        .send-btn {
            background:linear-gradient(135deg,#00b4d8,#0077b6);
            border:none;
            border-radius:50%;
            width:46px; height:46px;
            color:white;
            font-size:18px;
            cursor:pointer;
            flex-shrink:0;
        }
        .send-btn:active { transform:scale(0.9); }
        .modal {
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.85);
            z-index:200;
            align-items:flex-end;
            justify-content:center;
        }
        .modal.show { display:flex; }
        .modal-box {
            background:#161616;
            border-radius:24px 24px 0 0;
            padding:24px 20px 36px;
            width:100%;
            max-width:500px;
        }
        .modal-handle { width:40px; height:4px; background:#333; border-radius:2px; margin:0 auto 20px; }
        .modal-title { font-size:18px; font-weight:700; margin-bottom:16px; }
        .modal-item {
            background:#1e1e1e;
            border:1px solid #2a2a2a;
            border-radius:14px;
            padding:15px 16px;
            margin-bottom:10px;
            cursor:pointer;
            display:flex;
            align-items:center;
            gap:12px;
            font-size:15px;
        }
        .modal-close {
            background:#1e1e1e;
            border:1px solid #2a2a2a;
            border-radius:14px;
            padding:14px;
            color:#888;
            width:100%;
            font-size:15px;
            cursor:pointer;
            margin-top:6px;
        }
        .name-input {
            width:100%;
            background:#0f0f0f;
            border:1px solid #333;
            border-radius:12px;
            padding:12px 16px;
            color:white;
            font-size:15px;
            outline:none;
            margin-top:10px;
            font-family:inherit;
        }
        .confirm-btn {
            background:#00b4d8;
            border:none;
            border-radius:12px;
            padding:12px;
            color:white;
            width:100%;
            font-size:15px;
            cursor:pointer;
            margin-top:8px;
            font-weight:600;
        }
    </style>
</head>
<body>
<div class="header">
    <div class="header-left">
        <div class="avatar">✨</div>
        <div class="header-info">
            <h1>Grok AI</h1>
            <p id="status">● Онлайн</p>
        </div>
    </div>
    <button class="settings-btn" onclick="openModal()">⚙️</button>
</div>

<div class="mode-bar">
    <button class="mode-btn red" id="uncBtn" onclick="toggleMode('uncensored')">🔓 Без цензуры</button>
    <button class="mode-btn" id="imgBtn" onclick="toggleMode('image')">🎨 Картинка</button>
    <button class="mode-btn" id="remBtn" onclick="toggleMode('reminder')">⏰ Напоминание</button>
    <button class="mode-btn" onclick="clearAll()">🗑 Очистить</button>
</div>

<div class="chat" id="chat"></div>

<div class="input-area">
    <textarea class="input-field" id="input" placeholder="Напиши сообщение..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="send()">➤</button>
</div>

<div class="modal" id="modal" onclick="closeModalOutside(event)">
    <div class="modal-box">
        <div class="modal-handle"></div>
        <div class="modal-title">⚙️ Настройки</div>
        <div class="modal-item" onclick="showNameInput()">
            <span>👤</span>
            <div>
                <div>Моё имя</div>
                <div style="font-size:13px;color:#555" id="nameDisplay">Не указано</div>
            </div>
        </div>
        <div id="nameSection" style="display:none;margin-bottom:10px">
            <input class="name-input" id="nameInput" placeholder="Введи своё имя...">
            <button class="confirm-btn" onclick="saveName()">Сохранить</button>
        </div>
        <div class="modal-item" onclick="clearMemory()">
            <span>🗑</span>
            <div>Очистить память диалога</div>
        </div>
        <button class="modal-close" onclick="closeModal()">Закрыть</button>
    </div>
</div>

<script>
    let mode = 'normal';
    let userName = localStorage.getItem('grok_name') || '';
    let userId = localStorage.getItem('grok_uid') || ('u' + Math.random().toString(36).substr(2,9));
    let sending = false;
    localStorage.setItem('grok_uid', userId);
    if (userName) document.getElementById('nameDisplay').textContent = userName;

    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }
    function handleKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    }
    function scrollDown() {
        const c = document.getElementById('chat');
        c.scrollTop = c.scrollHeight;
    }
    function addMsg(text, type) {
        const chat = document.getElementById('chat');
        const wrap = document.createElement('div');
        wrap.className = 'msg-wrap ' + type;
        if (type === 'bot') {
            const n = document.createElement('div');
            n.className = 'bot-name';
            n.textContent = 'Grok AI';
            wrap.appendChild(n);
        }
        if (type === 'user' && userName) {
            const n = document.createElement('div');
            n.className = 'user-name';
            n.textContent = userName;
            wrap.appendChild(n);
        }
        const msg = document.createElement('div');
        msg.className = 'msg ' + type;
        msg.textContent = text;
        wrap.appendChild(msg);
        chat.appendChild(wrap);
        scrollDown();
        return wrap;
    }
    function addImg(prompt) {
        const chat = document.getElementById('chat');
        const wrap = document.createElement('div');
        wrap.className = 'msg-wrap bot';
        const n = document.createElement('div');
        n.className = 'bot-name';
        n.textContent = 'Grok AI';
        wrap.appendChild(n);
        const seed = Math.floor(Math.random() * 9999999);
        const url = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt + ', highly detailed, 8k, masterpiece') + '?width=1024&height=1024&nologo=true&seed=' + seed + '&model=flux';
        const loading = document.createElement('div');
        loading.className = 'img-loading';
        loading.innerHTML = '<div class="spinner"></div><span>Рисую...</span>';
        wrap.appendChild(loading);
        chat.appendChild(wrap);
        scrollDown();
        const img = new Image();
        img.onload = () => {
            const iw = document.createElement('div');
            iw.className = 'msg-img';
            img.style.width = '100%';
            iw.appendChild(img);
            wrap.replaceChild(iw, loading);
            scrollDown();
        };
        img.onerror = () => { loading.textContent = 'Не удалось загрузить.'; };
        img.src = url;
    }
    function toggleMode(m) {
        mode = mode === m ? 'normal' : m;
        document.getElementById('uncBtn').classList.toggle('active', mode === 'uncensored');
        document.getElementById('imgBtn').classList.toggle('active', mode === 'image');
        document.getElementById('remBtn').classList.toggle('active', mode === 'reminder');
        const input = document.getElementById('input');
        const msgs = { image: '🎨 Опиши что нарисовать...', reminder: '⏰ Напиши что и через сколько напомнить...', uncensored: 'Без цензуры...', normal: 'Напиши сообщение...' };
        input.placeholder = msgs[mode];
        const notes = { image: '🎨 Режим картинки включён.', reminder: '⏰ Режим напоминания. Пример: "Выпить воду через 30 минут"', uncensored: '🔓 Режим без цензуры включён.', normal: '🔒 Обычный режим.' };
        addMsg(notes[mode], 'system');
    }
    function clearAll() {
        document.getElementById('chat').innerHTML = '';
        addMsg('Чат очищен. Чем могу помочь?', 'bot');
    }
    async function clearMemory() {
        await fetch('/clear', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({user_id: userId}) });
        clearAll();
        closeModal();
        addMsg('🗑 Память очищена.', 'system');
    }
    function openModal() { document.getElementById('modal').classList.add('show'); }
    function closeModal() {
        document.getElementById('modal').classList.remove('show');
        document.getElementById('nameSection').style.display = 'none';
    }
    function closeModalOutside(e) { if (e.target === document.getElementById('modal')) closeModal(); }
    function showNameInput() {
        const s = document.getElementById('nameSection');
        s.style.display = s.style.display === 'none' ? 'block' : 'none';
        if (userName) document.getElementById('nameInput').value = userName;
    }
    function saveName() {
        const name = document.getElementById('nameInput').value.trim();
        if (!name) return;
        userName = name;
        localStorage.setItem('grok_name', name);
        document.getElementById('nameDisplay').textContent = name;
        closeModal();
        addMsg('✅ Запомнил! Буду звать тебя ' + name + '.', 'bot');
    }
    async function send() {
        if (sending) return;
        const input = document.getElementById('input');
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        input.style.height = 'auto';
        addMsg(text, 'user');
        sending = true;
        document.getElementById('sendBtn').disabled = true;
        document.getElementById('status').textContent = '● Печатает...';
        if (mode === 'image') {
            mode = 'normal';
            document.getElementById('imgBtn').classList.remove('active');
            document.getElementById('input').placeholder = 'Напиши сообщение...';
            addImg(text);
            sending = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('status').textContent = '● Онлайн';
            return;
        }
        if (mode === 'reminder') {
            mode = 'normal';
            document.getElementById('remBtn').classList.remove('active');
            document.getElementById('input').placeholder = 'Напиши сообщение...';
            try {
                const r = await fetch('/reminder', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text}) });
                const data = await r.json();
                addMsg(data.reply, 'bot');
                if (data.minutes) {
                    addMsg('⏰ Напоминание через ' + data.minutes + ' минут', 'system');
                    setTimeout(() => {
                        addMsg('🔔 НАПОМИНАНИЕ: ' + data.reminder_text, 'bot');
                        if ('Notification' in window) {
                            Notification.requestPermission().then(p => {
                                if (p === 'granted') new Notification('Grok AI', {body: data.reminder_text});
                            });
                        }
                    }, data.minutes * 60 * 1000);
                }
            } catch(e) { addMsg('Ошибка напоминания.', 'bot'); }
            sending = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('status').textContent = '● Онлайн';
            return;
        }
        const typingWrap = addMsg('⏳ Думаю...', 'typing');
        try {
            const r = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ text, user_id: userId, user_name: userName, uncensored: mode === 'uncensored' })
            });
            const data = await r.json();
            typingWrap.remove();
            addMsg(data.reply, 'bot');
        } catch(e) {
            typingWrap.remove();
            addMsg('Ошибка соединения.', 'bot');
        }
        sending = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('status').textContent = '● Онлайн';
    }
    window.onload = () => {
        if (userName) {
            addMsg('С возвращением, ' + userName + '! Чем могу помочь?', 'bot');
        } else {
            addMsg('👋 Привет! Я Grok AI.\n\nЯ умею:\n💬 Отвечать на вопросы\n🎨 Рисовать картинки\n⏰ Ставить напоминания\n🔓 Работать без цензуры\n\nНажми ⚙️ чтобы указать имя!', 'bot');
        }
    };
</script>
</body>
</html>
